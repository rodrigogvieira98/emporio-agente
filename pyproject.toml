[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "PyYAML>=6.0", "tzdata", "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1",
    "python-multipart>=0.0.9", "itsdangerous>=2.2"]

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.27"]
e2e = ["playwright>=1.45"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emporio = ["politicas/*.yaml", "agente/*.yaml", "agente/*.md", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: ponta a ponta com navegador (Playwright); rodar com: pytest -m e2e"]
