    tratamento: requer_confirmacao_da_equipe
  - id: prazo_30_x_90
    descricao: A troca por defeito é de 30 dias corridos desde a compra, e a garantia legal é de 90 dias desde o recebimento. O manual não explica como os dois prazos se combinam.
