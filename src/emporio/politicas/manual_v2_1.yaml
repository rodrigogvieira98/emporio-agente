# Transcrição do Manual de Políticas e Procedimentos, versão 2.1 (Junho de 2025).
# Fonte: data/raw/politicas_da_loja.pdf (extraído com pypdf). O campo `texto` segue o PDF,
# inclusive a grafia original. `condicoes` são os valores estruturados que o código consulta;
# nenhum fato de loja existe em arquivos .py.
manual:
  titulo: Manual de Políticas e Procedimentos
  versao: "2.1"
  data: Junho de 2025
  classificacao: Documento interno, uso restrito da equipe de atendimento
  fonte_pdf: data/raw/politicas_da_loja.pdf

secoes:
  - id: capa
    titulo: Capa
    pagina: 1
    temas: [manual, contato]
    publico: false
    texto: |
      EMPÓRIO DA MÚSICA
      Sua música começa aqui.
      MANUAL DE POLÍTICAS E PROCEDIMENTOS
      Atendimento ao Cliente
      Rua 14 de Maio, 3200 — Centro Campo Grande – MS – CEP 79202-333
      (67) 3341-4444 — contato@emporiodamusica.com.br
      Versão 2.1 — Junho de 2025
      Documento interno — Uso restrito da equipe de atendimento
    condicoes:
      - {chave: contato.telefone_capa, valor: "(67) 3341-4444"}
      - {chave: contato.email_capa, valor: "contato@emporiodamusica.com.br"}

  - id: "1"
    titulo: Sobre a Empório da Música
    pagina: 2
    temas: [empresa, escopo, catalogo]
    publico: true
    texto: |
      A Empório da Música é uma loja especializada em instrumentos musicais, fundada em 2008 em Campo Grande, Mato Grosso do Sul. Com mais de 15 anos de atuação no mercado, somos referência regional na venda de instrumentos para músicos iniciantes, intermediários e profissionais. Nosso catálogo abrange mais de 300 instrumentos de marcas nacionais e internacionais, incluindo guitarras, baixos, violões, baterias, teclados, instrumentos de sopro, cordas orquestrais e ukuleles. Trabalhamos exclusivamente com instrumentos musicais — não comercializamos acessórios como cordas, palhetas, cabos, cases, pedais ou amplificadores.
    condicoes:
      - {chave: empresa.nome_fantasia, valor: "Empório da Música"}
      - {chave: empresa.fundacao_ano, valor: 2008}
      - {chave: empresa.catalogo_instrumentos_mais_de, valor: 300}
      - {chave: escopo.somente_instrumentos, valor: true}
      - {chave: escopo.acessorios_nao_vendidos, valor: [cordas, palhetas, cabos, cases, pedais, amplificadores]}

  - id: "1.1"
    titulo: Missão
    pagina: 2
    temas: [empresa]
    publico: true
    texto: |
      Democratizar o acesso a instrumentos musicais de qualidade na região Centro-Oeste, oferecendo atendimento especializado e preços competitivos, contribuindo para o desenvolvimento cultural e musical da comunidade.
    condicoes: []

  - id: "1.2"
    titulo: Dados da Empresa
    pagina: 2
    temas: [empresa, endereco, contato]
    publico: true
    texto: |
      Campo | Informação
      Razão Social | Empório da Música Instrumentos Musicais Ltda.
      Nome Fantasia | Empório da Música
      CNPJ | 12.345.678/0001-90
