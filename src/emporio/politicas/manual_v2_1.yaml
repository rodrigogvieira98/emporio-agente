    tratamento: informar_ambos_e_pedir_confirmacao_da_equipe
  - id: parcela_minima
    descricao: A tabela de pagamento exige parcela mínima de R$ 100,00 no crédito, enquanto as regras de parcelamento têm faixas de R$ 50,00, R$ 80,00 e R$ 100,00.
