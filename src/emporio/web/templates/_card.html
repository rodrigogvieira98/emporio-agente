<article class="card" data-produto="{{ p.id }}">
  <a class="card-arte" href="/produto/{{ p.id }}" tabindex="-1" aria-hidden="true">
    <svg viewBox="0 0 64 64"><use href="/static/ilustracoes.svg#{{ p.ilustracao or 'instrumento' }}"/></svg>
  </a>
  <div class="etiqueta">
    <h3 class="et-nome"><a href="/produto/{{ p.id }}">{{ p.nome }}</a></h3>
    {% include "_preco.html" %}
    <p class="et-selo"><span class="selo selo-{{ p.situacao }}">{{ p.rotulo }}</span></p>
  </div>
</article>
