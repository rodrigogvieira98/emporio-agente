{% extends "base.html" %}
{% block titulo %}Políticas{% endblock %}
{% block conteudo %}
<div class="contorno pagina">
<h1>Políticas da loja</h1>
{% for s in secoes %}
<section class="politica" id="secao-{{ s.id }}">
  <h2>{{ s.titulo }}</h2>
  <p class="texto-politica">{{ s.texto | quebras }}</p>
</section>
{% endfor %}
</div>
{% endblock %}
